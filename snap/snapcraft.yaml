name: rob-cos-demo-configuration
base: core22
version: git
summary: A snap for configuring the rob cos snaps on the device.
description: |
  A snap for configuring the rob cos snaps on the device.
      
  This snap offers a default configuration for a rob cos device. 
  It also offers a content sharing interface, to allow snaps on a device that is meant
  to work with the rob-cos ecosystem to easily get configured.

  It offers a slot called configuration-read that allows plugged snaps to read data
  stored in $SNAP_COMMON/configuration.

  Usage:

  Connect as follows:
  sudo snap connect rob-cos-snap:configuration-read rob-cos-demo-configuration:configuration-read

grade: stable
confinement: strict

plugs:
  cos-registration-agent-control-configuration:
    interface: confdb
    account: VX84EGFo6txXHSNk4l55reEiaU5n7I7R
    view: cos-registration-agent/control-configuration

hooks:
  configure:
    plugs: [cos-registration-agent-control-configuration]
  connect-plug-cos-registration-agent-control-configuration:
    plugs: [cos-registration-agent-control-configuration]

slots:
  configuration-read:
    interface: content
    read: 
      - $SNAP_COMMON/configuration

parts:
  flask-deps:
    plugin: python
    source: .
    python-packages:
      - Flask==3.0.0
      - Werkzeug==3.0.1
    stage-packages:
      - python3-pip
  
  scripts:
    plugin: dump
    source: snap/local/
    organize:
      '*.sh': usr/bin/
      'init_confdb_service.py': usr/bin/
      'web_config_daemon.py': usr/bin/
      'configure_logic.py': usr/lib/
    stage:
      - usr/bin/*.sh
      - usr/bin/init_confdb_service.py
      - usr/bin/web_config_daemon.py
      - usr/lib/configure_logic.py
    after: [flask-deps]
  
  web-config:
    plugin: dump
    source: snap/local/web_config/
    organize:
      '*': usr/share/web_config/
  
  configuration:
    plugin: dump
    source: snap/local/configuration/
    organize:
      '*': /etc/configuration/

apps:
  generate-device-uid:
    command: usr/bin/generate_device_uid.sh

  reset-config:
    command: usr/bin/reset_config.sh

  init-confdb:
    command: usr/bin/init_confdb_service.py
    daemon: simple
    install-mode: disable
    plugs: [cos-registration-agent-control-configuration]
  
  web-config:
    command: usr/bin/web_config_daemon.py
    daemon: simple
    install-mode: disable
    plugs: 
      - network
      - network-bind
      - cos-registration-agent-control-configuration
