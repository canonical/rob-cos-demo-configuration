name: Integration tests
on:
  push:
    branches:
      - basic
  pull_request:
    branches:
      - basic
  workflow_dispatch:

jobs:
  fake-alert-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r tests/integration/requirements.txt
      - name: Self-test fake metrics server
        run: python tests/integration/fake_alert_publisher.py --self-test
